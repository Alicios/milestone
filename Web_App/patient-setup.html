<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <meta name="theme-color" content="#125b75" />
    <meta name="description" content="Set a password for your Milestone patient account." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%milestone-logo.svg" />
    <title>Set up your Milestone account</title>
    <style>
      :root {
        color-scheme: light;
        --primary: #125b75;
        --primary-dark: #0b3d50;
        --secondary: #d9822b;
        --background: #e8ddba;
        --paper: #ffffff;
        --text: #18323d;
        --text-secondary: #5c7079;
        --border: #d8e2e5;
        --error: #b3261e;
        --success: #2e7d62;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--background);
        color: var(--text);
        font-family: Roboto, system-ui, -apple-system, sans-serif;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: var(--paper);
        border-radius: 16px;
        padding: 32px 28px;
        box-shadow: 0 20px 50px rgba(11, 61, 80, 0.15);
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 8px;
        color: var(--primary-dark);
      }
      p.subtitle {
        margin: 0 0 24px;
        color: var(--text-secondary);
        font-size: 0.95rem;
      }
      label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 6px;
      }
      input[type='password'] {
        width: 100%;
        padding: 10px 12px;
        margin-bottom: 16px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 1rem;
      }
      input[type='password']:focus {
        outline: 2px solid var(--primary);
        outline-offset: 1px;
      }
      button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: var(--primary);
        color: white;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .message {
        border-radius: 8px;
        padding: 10px 14px;
        margin-bottom: 16px;
        font-size: 0.9rem;
      }
      .message.error {
        background: #fdecea;
        color: var(--error);
      }
      .message.success {
        background: #e8f5ee;
        color: var(--success);
      }
      .loading {
        color: var(--text-secondary);
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div id="app" class="card">
      <p class="loading">Checking your invitation link…</p>
    </div>
    <script type="module" src="/src/patient-setup/main.ts"></script>
  </body>
</html>
